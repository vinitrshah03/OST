<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Covid-19 Dashboard</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Covid-19 Dashboard</h2>
            <button class="close-aside">&times;</button>
        </div>
        <ul class="categories">
            <li class="has-dropdown">
                <a href="#">📊 Graphs & Reports <span class="arrow">▼</span></a>
                <ul class="sidebar-dropdown">
                    <li><a href="#time_series">Active Cases Trend</a></li>
                    <li><a href="#bar_chart">Incident Rate by Country</a></li>
                    <li><a href="#correlation_matrix">Correlation Matrix</a></li>
                </ul>
            </li>
            <li><a href="#">ℹ️ About</a></li>
            <li><a href="#">👤 Profile</a></li>
            <li>
                <span id="light-label">Light</span>
                <label class="theme-switch">
                    <input type="checkbox" id="dark-mode-toggle">
                    <span class="slider"></span>
                </label>
                <span id="dark-label">Dark</span>
            </li>            
        </ul>
    </div>

    <!-- Content Wrapper -->
    <div id="wrapper">
        <!-- Button to toggle sidebar -->
        <button class="show-side-btn">☰ Menu</button>
        <div class="container">
            <h2 id="time_series">Active Cases and Death Cases Trends Over Time</h2>
            <img src="{{ url_for('time_series') }}" alt="Active Cases Time Series Graph">
            
            <h2 id="bar_chart">Average Covid-19 Incident Rate by Country</h2>
            <img src="{{ url_for('bar_chart') }}" alt="Bar Chart of Incident Rate by Country">
            
            <h2 id="correlation_matrix">Correlation Matrix of Covid-19 Data</h2>
            <img src="{{ url_for('correlation_matrix') }}" alt="Correlation Matrix Heatmap">
        </div>
    </div>

</body>
</html>
